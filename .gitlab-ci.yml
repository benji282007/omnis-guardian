# Omnis Guardian for Kutt — CI/CD pipeline (Path B: new automation around upstream Kutt)
#
# verify   config_check · unit_tests · regression_proof (MRs)
# secure   sast_semgrep · secret_detection · dependency_scan → security_gate (fails closed)
# package  build_image (+ provenance; signed + attested on main) → smoke_image (boots the image)
# release  verify_signatures → release_gate (manual: the approval) → publish_release
# deploy   deploy_production (Cloud Run: candidate → smoke → promote → verify → auto-rollback)
#          carbon_report · pages (evidence dashboard)
# schedule monitor_production (schedule only): live probes + drift against the release
#          and guardian/gcp/runtime-config.json; a failure triggers Duo incident triage
#
# The Duo flow (.gitlab/duo/flows/omnis-guardian.yml) is triggered by GitLab when a
# merge request pipeline fails, and by mentions. It is configured in the GitLab UI.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

stages:
  - verify
  - secure
  - package
  - release
  - deploy

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  NODE_IMAGE: "node:22-alpine"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  interruptible: true

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push

.npm_install:
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - npm ci --no-audit --no-fund

# Scheduled pipelines run only monitor_production (the scheduled production check).
.not_scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.main_only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------ verify
config_check:
  extends: .not_scheduled
  stage: verify
  image: python:3.12-slim
  needs: []
  script:
    - pip install --quiet pyyaml==6.0.2
    - python3 guardian/ci/validate_config.py

unit_tests:
  extends: [.node, .npm_install, .not_scheduled]
  stage: verify
  needs: []
  script:
    - >-
      node --test --test-timeout=60000
      --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=junit-kutt.xml
      "test/**/*.test.js"
    - >-
      node --test
      --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=junit-guardian.xml
      "guardian/test/*.test.mjs" "guardian/dashboard/test/*.test.mjs"
  artifacts:
    when: always
    expire_in: 90 days
    reports:
      junit: [junit-kutt.xml, junit-guardian.xml]

# A fix is verified only if its new or changed tests fail on the old code and pass
# on the fix. Required on guardian/* branches (opened by the Duo flow).
regression_proof:
  extends: [.node, .npm_install]
  stage: verify
  needs: []
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" in
        guardian/*) export REQUIRE_REGRESSION_TEST=true ;;
      esac
    - node guardian/ci/regression-proof.mjs --out regression-proof.json
  artifacts:
    when: always
    expire_in: 1 year
    paths: [regression-proof.json]

# ------------------------------------------------------------------ secure
sast_semgrep:
  extends: .not_scheduled
  stage: secure
  image: python:3.12-slim
  needs: []
  script:
    - pip install --quiet semgrep==1.182.1
    - semgrep scan --metrics=off --disable-version-check --config guardian/semgrep/rules.yml --gitlab-sast --output gl-sast-report.json .
  artifacts:
    when: always
    expire_in: 1 year
    paths: [gl-sast-report.json]
    reports:
      sast: gl-sast-report.json

secret_detection:
  stage: secure
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  artifacts:
    when: always
    expire_in: 1 year
    paths: [gl-secret-detection-report.json]
    reports:
      secret_detection: gl-secret-detection-report.json

dependency_scan:
  extends: [.node, .not_scheduled]
  stage: secure
  needs: []
  script:
    - node guardian/ci/dependency-report.mjs --out gl-dependency-report.json
  artifacts:
    when: always
    expire_in: 1 year
    paths: [gl-dependency-report.json]

security_gate:
  extends: .not_scheduled
  image: $NODE_IMAGE
  stage: secure
  needs:
    - { job: sast_semgrep, artifacts: true }
    - { job: secret_detection, artifacts: true }
    - { job: dependency_scan, artifacts: true }
  script:
    - node guardian/ci/security-gate.mjs gl-sast-report.json gl-secret-detection-report.json gl-dependency-report.json --out security-summary.json
  artifacts:
    when: always
    expire_in: 1 year
    paths: [security-summary.json]

# ------------------------------------------------------------------ package
# Build, attest and (on main) sign in ONE job, so the image cannot change in between.
build_image:
  extends: .not_scheduled
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  needs: [unit_tests, security_gate]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - sh guardian/ci/build-image.sh
  artifacts:
    expire_in: 1 year
    paths: [dist/]
    reports:
      dotenv: image.env

# Boot the image that was just built (not the source tree) and run user journeys.
smoke_image:
  extends: .not_scheduled
  image: $NODE_IMAGE
  stage: package
  needs: [build_image]
  services:
    - name: $CI_REGISTRY_IMAGE/kutt:$CI_COMMIT_SHA
      alias: kutt
  variables:
    JWT_SECRET: "ci-smoke-only-not-a-real-secret"
    DEFAULT_DOMAIN: "kutt:3000"
    KUTT_ADMIN_EMAIL: "smoke@example.test"
    KUTT_ADMIN_PASSWORD: "ci-smoke-only-password-1"
  script:
    - node guardian/ci/smoke.mjs --url http://kutt:3000 --out smoke-result.json
  artifacts:
    when: always
    expire_in: 1 year
    paths: [smoke-result.json]

# ------------------------------------------------------------------ release
verify_signatures:
  image: alpine:3.21
  stage: release
  needs: [build_image]
  extends: .main_only
  script:
    - sh guardian/ci/verify-signatures.sh
  artifacts:
    when: always
    expire_in: 1 year
    paths: [dist/signature-result.json]

# The Assisted release step. Starting this manual job IS the approval: GitLab records
# who started it; the gate checks they are on RELEASE_APPROVERS (and not the commit
# author unless RELEASE_REQUIRE_FOUR_EYES=false) and re-verifies all evidence.
release_gate:
  image: $NODE_IMAGE
  stage: release
  needs: [build_image, security_gate, smoke_image, verify_signatures]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  interruptible: false
  environment:
    name: production
    action: prepare
  script:
    - node guardian/ci/release-gate.mjs
    - echo "RELEASE_GATE_JOB_ID=$CI_JOB_ID" > gate.env
  artifacts:
    when: always
    expire_in: never
    paths: [release-evidence.json]
    reports:
      dotenv: gate.env

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [release_gate, build_image]
  extends: .main_only
  interruptible: false
  # Notes are written here, not in release:description, because GitLab expands that field
  # before dotenv variables (IMAGE_REF, job ids) exist, and its shell would run backticks.
  # Links point at artifacts by job id: "latest artifact on main" would resolve to a scheduled
  # monitor pipeline once one has passed.
  script:
    - echo "Releasing Kutt image ${IMAGE_REF}"
    - |
      {
        printf 'Approved through the Omnis Guardian release gate.\n\n'
        printf -- '- Image: %s\n' "$IMAGE_REF"
        printf -- '- Commit: %s\n' "$CI_COMMIT_SHA"
        printf -- '- Pipeline: %s\n' "$CI_PIPELINE_URL"
        printf -- '- Signed and attested with Sigstore keyless signing. Verify with %s and %s.\n' \
          "cosign verify" "cosign verify-attestation --type slsaprovenance1"
        printf -- '- SLSA provenance (in-toto v1): %s/-/jobs/%s/artifacts/raw/dist/provenance.intoto.json\n' "$CI_PROJECT_URL" "$BUILD_JOB_ID"
        printf -- '- Release evidence (who approved, what was checked): %s/-/jobs/%s/artifacts/raw/release-evidence.json\n' "$CI_PROJECT_URL" "$RELEASE_GATE_JOB_ID"
      } > release-notes.md
    - cat release-notes.md
  release:
    tag_name: "guardian-${CI_PIPELINE_IID}"
    name: "Kutt + Omnis Guardian, pipeline ${CI_PIPELINE_IID}"
    ref: "$CI_COMMIT_SHA"
    description: "./release-notes.md"

# ------------------------------------------------------------------ deploy
deploy_production:
  stage: deploy
  image: google/cloud-sdk:slim
  needs: [publish_release, build_image]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
  interruptible: false
  resource_group: production
  environment:
    name: production
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/${GCP_WIF_PROVIDER}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq nodejs >/dev/null
  script:
    - sh guardian/ci/deploy-cloudrun.sh
  artifacts:
    when: always
    expire_in: never
    paths: [deploy-result.json, smoke-candidate.json, smoke-production.json]

# Scheduled production check (every two hours), run by a pipeline schedule on main (CI/CD > Schedules).
# Monitor: the five live smoke probes. Configure: the live service must serve the last
# approved digest with the settings in guardian/gcp/runtime-config.json (drift detection).
# A failure fails the pipeline, which triggers the Duo flow to open an incident issue.
monitor_production:
  stage: deploy
  image: google/cloud-sdk:slim
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
  interruptible: false
  resource_group: production
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/${GCP_WIF_PROVIDER}"
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq nodejs >/dev/null
  script:
    - sh guardian/ci/monitor-cloudrun.sh
  artifacts:
    when: always
    expire_in: 1 year
    paths: [monitor-result.json]

carbon_report:
  extends: .not_scheduled
  image: $NODE_IMAGE
  stage: deploy
  allow_failure: true
  needs:
    - { job: build_image, artifacts: false }
    - { job: smoke_image, artifacts: false }
  script:
    - node guardian/ci/carbon-report.mjs --out carbon-report.json
  artifacts:
    when: always
    expire_in: 1 year
    paths: [carbon-report.json]

pages:
  image: $NODE_IMAGE
  stage: deploy
  needs:
    - { job: build_image }
    - { job: security_gate }
    - { job: smoke_image }
    - { job: carbon_report }
    - { job: verify_signatures }
  extends: .main_only
  script:
    - node guardian/dashboard/build.mjs --out public
  artifacts:
    paths: [public]
